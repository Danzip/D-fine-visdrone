# D-FINE-S VisDrone — Experiment: AR-aware rectangular training (first run)
#
# Goal: test whether rectangular training (16:9 → 736×1280, 4:3 → 960×1280)
# helps vs the square 1024×1024 baseline (AP=0.2966, epoch 131).
#
# Design:
#   - ARBucketBatchSampler groups images by original COCO AR (16:9 or 4:3).
#   - Dataset-level transforms are AR-neutral: no ZoomOut, no IoUCrop, no Resize.
#     This guarantees that images arrive at collate with their original AR intact,
#     so the bucket assignment from COCO metadata is accurate.
#   - Collate letterboxes each image into its canonical bucket shape (736×1280
#     for 16:9, 960×1280 for 4:3) using orig_size to compute target dims.
#   - Fixed resolution (no multi-scale) to isolate the AR variable.
#   - AMP / fp16 mandatory (RTX 4060 8GB).
#
# Disabled for this run (re-enable one at a time after this baseline works):
#   - RandomZoomOut    (changes AR unpredictably)
#   - RandomIoUCrop    (changes AR unpredictably)
#   - CopyPasteSmallObjects  (causes 3-tuple transform crash)
#   - Mosaic           (4× pixel OOM; also changes AR)
#   - Multi-resolution (isolate AR variable)
#   - dataset-level Resize   (was squashing natural AR)
#
# USAGE:
#   python train.py -c configs/dfine/dfine_hgnetv2_s_visdrone_ar.yml \
#       --device cuda:0 --resume output/dfine_hgnetv2_s_visdrone_ms1280_cont/best_stg1.pth

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_s_visdrone_ar
exp_name: dfine_s_visdrone_ar
use_wandb: True
use_amp: True
eval_spatial_size: [736, 1280]
accum_steps: 1

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 500
lr_scheduler:
  type: CosineAnnealingLR
  T_max: 500
  eta_min: 0.000001
  milestones: ~
  gamma: ~

train_dataloader:
  total_batch_size: 3
  use_ar_sampler: True
  num_workers: 8
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: default
  collate_fn:
    stop_epoch: 9999
    base_size: 1280
    base_size_repeat: ~      # null → fixed resolution, no multi-scale
    adaptive_batch: False
    ema_restart_decay: 0.9999
    mosaic_p: 0.0

val_dataloader:
  total_batch_size: 1
  num_workers: 0
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [736, 1280]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
