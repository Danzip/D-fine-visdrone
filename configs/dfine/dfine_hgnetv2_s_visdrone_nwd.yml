# D-FINE-S VisDrone — NWD + size-adaptive loss run
#
# Starts from mosaic_resume best_stg2.pth (epoch 92, AP=0.3142).
#
# Changes vs mosaic_resume:
#   1. NWD in Hungarian cost matrix (cost_nwd=2, nwd_constant=0.5):
#      GIoU cost gives non-zero gradient for non-overlapping boxes but is not
#      size-relative — a 4px displacement on a 4px object costs the same as on
#      a 40px object. NWD measures distance in (cx,cy,w/2,h/2) space, making it
#      proportional to box size. Better matching for VisDrone tiny objects.
#   2. size_adaptive=True in criterion:
#      Weights all box losses (L1, GIoU, FGL) by 1/area after matching.
#      VisDrone: 77% of boxes < 16px. Equal-weight loss means large objects
#      dominate gradients. Inverse-area weighting gives tiny objects equal
#      influence regardless of size.
#   3. maxDets=500 in COCO eval (in det_engine.py):
#      Default maxDets=100 caps recall to ~12% for images with 800 objects.
#      500 matches typical VisDrone scene density.
#   4. num_top_queries=500: more candidate detections for eval.
#
# Smoke test:
#   cd D-FINE && source venv/bin/activate
#   python train.py -c configs/dfine/dfine_hgnetv2_s_visdrone_nwd.yml \
#     --device cuda:0 --tuning output/dfine_hgnetv2_s_visdrone_mosaic_resume/best_stg2.pth \
#     -u train_dataloader.num_workers=0 max_train_steps=20
#
# Full run (via watchdog):
#   bash train_watchdog_nwd.sh

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_s_visdrone_nwd
exp_name: dfine_s_visdrone_nwd_sqrt
use_wandb: True
use_amp: True
eval_spatial_size: [1024, 1024]
accum_steps: 4
num_top_queries: 500

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

DFINECriterion:
  size_adaptive: True

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2, cost_nwd: 2}
    nwd_constant: 0.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 320
lr_scheduler:
  type: CosineAnnealingLR
  T_max: 160
  eta_min: 0.0000001
  milestones: ~
  gamma: ~

train_dataloader:
  total_batch_size: 4
  num_workers: 2
  repeat_factor_threshold: 0.5
  shuffle: true
  drop_last: true
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 1024, p: 0.5}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: CopyPasteSmallObjects, max_size: 32, num_paste: 10, p: 0.5}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 80
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomIoUCrop', 'CopyPasteSmallObjects']
  collate_fn:
    stop_epoch: 80
    base_size: 1024
    base_size_repeat: 3
    adaptive_batch: True
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 1
  num_workers: 2
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
