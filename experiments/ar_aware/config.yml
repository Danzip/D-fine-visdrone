# Experiment: AR-aware rectangular training + NWD matcher + SAL sqrt
# Start: best_dfine_s_visdrone_nwd_sqrt_v2.pth (AP=0.321)
#
# Key idea: VisDrone is ~50% 16:9 and ~50% 4:3. Training on square 1024x1024
# wastes pixels on letterbox bars and squishes objects. This experiment trains
# each AR bucket at its canonical resolution:
#   16:9 images → 736 x 1280 (h x w)
#   4:3  images → 960 x 1280 (h x w)
#
# ARBucketBatchSampler ensures each batch contains only same-AR images.
# ARLetterboxCollateFunction proportionally scales + center-pads to canvas.
# No Mosaic or IoUCrop — both change AR unpredictably and would fight the sampler.
# Eval on 736x1280 (val split is 100% 16:9).
#
# The original AR experiment (April 2026) failed at AP~0.05 due to wrong starting
# point (AP=0.297). We now tune from AP=0.321 which should provide much better
# gradient signal for the rectangular head to learn from.

__include__: [
  '../../configs/dataset/visdrone_detection.yml',
  '../../configs/runtime.yml',
  '../../configs/dfine/include/dataloader.yml',
  '../../configs/dfine/include/optimizer.yml',
  '../../configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: ./output/ar_aware
exp_name: ar_aware
tuning: ./output/dfine_hgnetv2_s_visdrone_nwd/best_stg1_dfine_s_visdrone_nwd_sqrt.pth
use_wandb: True
use_amp: True
eval_spatial_size: [736, 1280]
accum_steps: 16
num_top_queries: 500

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

DFINECriterion:
  size_adaptive: True
  sal_mode: 'sqrt'

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2, cost_nwd: 2}
    nwd_constant: 0.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 110
lr_scheduler:
  type: WarmupCosineHoldLR
  warmup_epochs: 50
  cosine_epochs: 60
  warmup_start_lr: 0.00000001
  eta_min: 0.0000001
  milestones: ~
  gamma: ~

train_dataloader:
  total_batch_size: 2
  num_workers: 4
  use_ar_sampler: True
  shuffle: false
  drop_last: true
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: CopyPasteSmallObjects, max_size: 32, num_paste: 10, p: 0.5}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: ARLetterboxCollateFunction
    base_size: 1280
    stop_epoch: 100000000
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 1
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [736, 1280]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
