# Experiment: 4-level D-FINE (P2+P3+P4+P5) at 640x640
# Standard DETR-style P2 addition: full MSDeformableAttention on all 4 levels.
# At 640x640, P2 feature map = 160x160 = 25,600 tokens (vs 80x80=6,400 for P3).
# Feasible on 8GB+ GPU. Contrast with msfd_1024 which keeps transformer at 3 levels.
#
# Start: best_stg1_dfine_s_visdrone_nwd_sqrt.pth (AP=0.321)
# New params: P2 input projection in HybridEncoder (random init, warmup handles it).

__include__: [
  '../../configs/dataset/visdrone_detection.yml',
  '../../configs/runtime.yml',
  '../../configs/dfine/include/dataloader.yml',
  '../../configs/dfine/include/optimizer.yml',
  '../../configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: ./output/p2_640
exp_name: p2_640
tuning: ~
use_wandb: True
use_amp: True
eval_spatial_size: [640, 640]
accum_steps: 4
num_top_queries: 500

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]   # P2(64ch) P3(256) P4(512) P5(1024)
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [64, 256, 512, 1024]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]         # AIFI on P5 (index 3 in 4-level list)
  depth_mult: 0.34
  expansion: 0.5

DFINETransformer:
  num_layers: 3
  eval_idx: -1
  num_levels: 4
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  num_points: [2, 3, 6, 3]    # fewer points at P2 to limit compute

DFINECriterion:
  size_adaptive: True
  sal_mode: 'sqrt'

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2, cost_nwd: 2}
    nwd_constant: 0.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 110
lr_scheduler:
  type: WarmupCosineHoldLR
  warmup_epochs: 50
  cosine_epochs: 60
  warmup_start_lr: 0.00000001
  eta_min: 0.0000001
  milestones: ~
  gamma: ~

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  repeat_factor_threshold: 0.5
  shuffle: true
  drop_last: true
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 640, p: 0.5}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: CopyPasteSmallObjects, max_size: 32, num_paste: 10, p: 0.5}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 80
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomIoUCrop', 'CopyPasteSmallObjects']
  collate_fn:
    stop_epoch: 80
    base_size: 640
    base_size_repeat: 3
    adaptive_batch: True
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 1
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
