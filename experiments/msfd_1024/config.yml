# Experiment: MSFD — YOLOv8-style P2 conv head at 1024x1024
#
# Architecture:
#   HGNetV2 (4 stages) → HybridEncoder (4 levels: P2/P3/P4/P5)
#   ├── DFINETransformer (P3/P4/P5 only, 3 levels) — unchanged
#   └── P2ConvHead       (P2 only, YOLOv8-style DWConv head)
#
# P2ConvHead does NOT use MSDeformableAttention. Two DWConv blocks →
# dense predictions at stride 4. FCOS-style TAL assignment for loss.
# At 1024×1024: P2 feature map = 256×256 = 65536 positions (dense).
# Transformer stays at 3 levels → no 65K token cross-attention.
#
# Start: best_stg1_dfine_s_visdrone_nwd_sqrt.pth (AP=0.321)
# New params: P2 input projection + P2ConvHead (both randomly inited).

__include__: [
  '../../configs/dataset/visdrone_detection.yml',
  '../../configs/runtime.yml',
  '../../configs/dfine/include/dataloader.yml',
  '../../configs/dfine/include/optimizer.yml',
  '../../configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: ./output/msfd_1024
exp_name: msfd_1024
tuning: ~
use_wandb: True
use_amp: True
eval_spatial_size: [1024, 1024]
accum_steps: 4
num_top_queries: 500

DFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  p2_head: P2ConvHead
  p2_fusion: P2FusionLite    # cheap-FPN: raw P2 + upsampled neck-P3 (~+3% FLOPs)

P2FusionLite:
  p2_channels: 64       # raw backbone stage-0
  p3_channels: 256      # HybridEncoder hidden_dim (neck P3)
  out_channels: 128

P2ConvHead:
  in_channels: 128      # P2FusionLite out_channels
  hidden_dim: 128
  num_classes: 10       # VisDrone

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]   # P2(64ch) P3(256) P4(512) P5(1024)
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [256, 512, 1024]   # 3-level (P3/P4/P5) — P2 bypasses the neck
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]            # AIFI on P5 (index 2 in 3-level list)
  depth_mult: 0.34
  expansion: 0.5

DFINETransformer:
  num_layers: 3
  eval_idx: -1
  num_levels: 3
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]   # P3/P4/P5 only

DFINECriterion:
  size_adaptive: True
  sal_mode: 'sqrt'
  use_nwd_loss: True        # R2: additive NWD regression loss (size-relative)
  nwd_loss_constant: 0.5

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2, cost_nwd: 2}
    nwd_constant: 0.5
    alpha: 0.25
    gamma: 2.0

  # P2ConvHead loss weights (separate from transformer decoder losses)
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_nwd: 2, loss_fgl: 0.15, loss_ddf: 1.5,
                loss_p2_cls: 1.0, loss_p2_reg: 5.0, loss_p2_iou: 2.0}

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder|p2_head))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 110
lr_scheduler:
  type: WarmupCosineHoldLR
  warmup_epochs: 50
  cosine_epochs: 60
  warmup_start_lr: 0.00000001
  eta_min: 0.0000001
  milestones: ~
  gamma: ~

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  repeat_factor_threshold: 0.5
  shuffle: true
  drop_last: true
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 1024, p: 0.5}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        # R3: rare-class targeting (2=bicycle 6=tricycle 7=awning-tricycle) + scale jitter
        - {type: CopyPasteSmallObjects, max_size: 32, num_paste: 10, p: 0.5,
           rare_labels: [2, 6, 7], rare_boost: 3.0, scale_jitter: [0.7, 1.4]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 80
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomIoUCrop', 'CopyPasteSmallObjects']
  collate_fn:
    stop_epoch: 80
    base_size: 1024
    base_size_repeat: 3
    adaptive_batch: True
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 1
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
